<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.46" r="0.7">
      <stop offset="0" stop-color="#243149"/>
      <stop offset="1" stop-color="#151c28"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g transform="translate(288,-62)">
    <!-- radar scope: crosshair + dotted range rings -->
    <g fill="none" stroke="#7fcbe0" stroke-linecap="round">
      <line x1="512" y1="150" x2="512" y2="874" stroke-opacity="0.12" stroke-width="6"/>
      <line x1="150" y1="512" x2="874" y2="512" stroke-opacity="0.12" stroke-width="6"/>
      <circle cx="512" cy="512" r="352" stroke-opacity="0.55" stroke-width="12" stroke-dasharray="1 46"/>
      <circle cx="512" cy="512" r="256" stroke-opacity="0.32" stroke-width="9"  stroke-dasharray="2 24"/>
      <circle cx="512" cy="512" r="160" stroke-opacity="0.20" stroke-width="8"  stroke-dasharray="2 20"/>
    </g>
    <!-- Blackbird, drawn as a dot-matrix outline (preserves the dotted-header identity) -->
