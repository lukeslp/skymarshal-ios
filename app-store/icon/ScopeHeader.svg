          fill="#7fcbe0" fill-opacity="0.14"
          stroke="#9fe0f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 13"/>
    <!-- orange lock-on -->
    <g fill="none" stroke="#ff8a2a" stroke-width="7" stroke-linecap="round">
      <path d="M673 205 V185 H693"/><path d="M733 185 H753 V205"/>
      <path d="M753 245 V265 H733"/><path d="M693 265 H673 V245"/>
    </g>
    <circle cx="713" cy="225" r="9" fill="#ff8a2a"/>
  </g>
</svg>
