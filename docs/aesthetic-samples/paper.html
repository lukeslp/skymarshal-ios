<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skymarshal sample — Paper zine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4F0E6;
      --ink: #1A1A1A;
      --margin-rule: #C4B8A8;
      --ribbon: #B23A3A;
      --serif: "Fraunces", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    /* light halftone-ish noise */
    .paper-bg {
      min-height: 100vh;
      background-color: var(--paper);
      background-image: radial-gradient(circle, rgba(26, 26, 26, 0.06) 1px, transparent 1px);
      background-size: 4px 4px;
    }
    .phone { max-width: 390px; margin: 0 auto; padding: 28px 20px 40px; }
    .masthead {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .masthead h1 {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 600;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .masthead .deck {
      font-size: 0.875rem;
      color: #4a4540;
      margin: 0 0 20px;
      max-width: 22em;
    }
    .masthead .rule {
      height: 1px;
      background: var(--margin-rule);
      margin: 12px 0;
    }
    .masthead label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #5c564c; }
    .masthead input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid var(--margin-rule);
      background: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 0.9375rem;
      border-radius: 2px;
    }
    .btn-signin {
      margin-top: 18px;
      width: 100%;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 600;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 3px;
      cursor: default;
    }
    .content-block {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--margin-rule);
    }
    .content-block h2 {
      font-family: var(--serif);
      font-size: 1.375rem;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .content-block .issue-line {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: #5c564c;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 10px;
      border: 1px solid var(--margin-rule);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
    }
    .tag.accent { border-color: var(--ink); }
    .ribbon-note {
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--ribbon);
    }
    .tabs {
      display: flex;
      margin-top: 28px;
      padding-top: 14px;
      border-top: 2px solid var(--ink);
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.65rem;
    }
    .tabs button {
      flex: 1;
      padding: 10px 6px;
      border: 1px solid var(--margin-rule);
      background: transparent;
      color: var(--ink);
      border-radius: 2px;
      cursor: default;
    }
    .tabs button.active {
      border-color: var(--ink);
      font-weight: 600;
    }
    .footer {
      margin-top: 28px;
      font-size: 0.7rem;
      color: #6a6358;
      text-align: center;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="paper-bg">
    <div class="phone">
      <header class="masthead">
        <h1>Skymarshal</h1>
        <p class="deck">Air-traffic control for your Bluesky</p>
        <div class="rule" aria-hidden="true"></div>
        <label for="h">Bluesky handle</label>
        <input id="h" type="text" value="you.bsky.social" readonly>
        <label for="p" style="margin-top:14px;display:block">App password</label>
        <input id="p" type="password" value="············" readonly>
        <button type="button" class="btn-signin">Sign in</button>
        <p class="ribbon-note">Ribbon tone reserved for destructive emphasis in product.</p>
      </header>

      <section class="content-block" aria-label="Content header sample">
        <h2>My Content</h2>
        <div class="issue-line">
          <span>ISSUE MAY 15</span>
          <span>you.bsky.social</span>
        </div>
        <div class="tags">
          <span class="tag accent">All · 1</span>
          <span class="tag">Posts · 1</span>
          <span class="tag">Replies · 0</span>
        </div>
      </section>

      <nav class="tabs" aria-label="Tab bar sample">
        <button type="button" class="active">Content</button>
        <button type="button">Followers</button>
        <button type="button">Scope</button>
      </nav>
      <p class="footer">Direction B · riso_scope · Fraunces + IBM Plex Mono</p>
    </div>
  </div>
</body>
</html>
