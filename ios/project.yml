name: Skymarshal
options:
  bundleIdPrefix: blue.skymarshal.ios
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  # Shared framework — networking, models, services, storage.
  # Linked by the main app and any future extensions (Share/Action/Widget).
  SkymarshalCore:
    type: framework
    platform: iOS
    sources:
      - path: SkymarshalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.skymarshal.ios.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        CURRENT_PROJECT_VERSION: "20"
        MARKETING_VERSION: "1.0.1"
        ENABLE_MODULE_VERIFIER: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkymarshalCore

  Skymarshal:
    type: application
    platform: iOS
    sources:
      - path: Skymarshal
    info:
      path: Skymarshal/Info.plist
      properties:
        CFBundleDisplayName: Skymarshal
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "20"
        UILaunchScreen:
          UIImageName: EasterAlf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        WKAppBoundDomains:
          - skymarshal.blue
        BGTaskSchedulerPermittedIdentifiers:
          - blue.skymarshal.ios.refresh
          - blue.skymarshal.ios.processing
        UIBackgroundModes:
          - fetch
          - processing
        UIAppFonts:
          - IBMPlexMono-Regular.otf
          - IBMPlexMono-Medium.otf
          - IBMPlexMono-SemiBold.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.skymarshal.ios
        CODE_SIGN_ENTITLEMENTS: Skymarshal/Skymarshal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
    dependencies:
      - target: SkymarshalCore

  SkymarshalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkymarshalTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.skymarshal.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skymarshal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Skymarshal"
    dependencies:
      - target: Skymarshal
      - target: SkymarshalCore

  SkymarshalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkymarshalUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.skymarshal.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Skymarshal
    dependencies:
      - target: Skymarshal

schemes:
  Skymarshal:
    build:
      targets:
        Skymarshal: all
        SkymarshalCore: all
    test:
      targets:
        - SkymarshalTests
        - SkymarshalUITests
    run:
      config: Debug
    archive:
      config: Release
