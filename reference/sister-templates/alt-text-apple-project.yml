name: AltTextStudio
options:
  bundleIdPrefix: app.alttextstudio.ios
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  # Shared framework: Pipeline + Standards + Vision + Availability + Sharing.
  # Linked by main app + both extensions so the composer code lives once.
  AltTextStudioCore:
    type: framework
    platform: iOS
    sources:
      - path: AltTextStudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ENABLE_MODULE_VERIFIER: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AltTextStudioCore

  AltTextStudio:
    type: application
    platform: iOS
    sources:
      - path: AltTextStudio
    info:
      path: AltTextStudio/Info.plist
      properties:
        CFBundleDisplayName: Alt Text Studio
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Capture an image to describe. The image never leaves your device.
        NSPhotoLibraryUsageDescription: Pick a photo to describe. Photos are never uploaded.
        CFBundleURLTypes:
          - CFBundleURLName: app.alttextstudio.ios
            CFBundleURLSchemes:
              - alttextstudio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios
        CODE_SIGN_ENTITLEMENTS: AltTextStudio/AltTextStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: AltTextStudioCore
      - target: AltTextStudioShareExtension
      - target: AltTextStudioActionExtension

  AltTextStudioShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AltTextStudioShareExtension
    info:
      path: AltTextStudioShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Alt Text
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios.share
        CODE_SIGN_ENTITLEMENTS: AltTextStudioShareExtension/ShareExtension.entitlements
    dependencies:
      - target: AltTextStudioCore

  AltTextStudioActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AltTextStudioActionExtension
    info:
      path: AltTextStudioActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Alt Text
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
            NSExtensionServiceAllowsFinderPreviewItem: false
            NSExtensionServiceAllowsTouchBarItem: false
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionMainStoryboard: MainInterface
        NSExtensionActivationDictionaryVersion: 2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios.action
        CODE_SIGN_ENTITLEMENTS: AltTextStudioActionExtension/ActionExtension.entitlements
    dependencies:
      - target: AltTextStudioCore

  AltTextStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AltTextStudioTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AltTextStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AltTextStudio"
    dependencies:
      - target: AltTextStudio
      - target: AltTextStudioCore

  AltTextStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AltTextStudioUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alttextstudio.ios.uitests
        TEST_TARGET_NAME: AltTextStudio
    dependencies:
      - target: AltTextStudio

schemes:
  AltTextStudio:
    build:
      targets:
        AltTextStudio: all
        AltTextStudioCore: all
        AltTextStudioShareExtension: all
        AltTextStudioActionExtension: all
    test:
      targets:
        - AltTextStudioTests
        - AltTextStudioUITests
    run:
      config: Debug
    archive:
      config: Release
